<!doctype html>
<html lang="pl">
<head>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InnovateTranslations — tłumaczenia PL/EN/RU</title>
  <meta name="description" content="InnovateTranslations — profesjonalne usługi tłumaczeniowe (PL/EN/RU). Szybka wycena, komunikacja e-mail, terminowość." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://innovatetranslations.github.io/InnovateTranslations/" />

  <meta property="og:title" content="InnovateTranslations — usługi tłumaczeniowe" />
  <meta property="og:description" content="Tłumaczenia PL/EN/RU dla firm. Szybka wycena i terminowa realizacja." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/InnovateTranslations/assets/style.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">InnovateTranslations</div>
      <div class="lang">
       <a href="/InnovateTranslations/pl/">PL</a>
       <a href="/InnovateTranslations/en/">EN</a>
       <a href="/InnovateTranslations/ru/">RU</a>
      </div>
    </div>

   <section class="hero" style="text-align:center">
  <h1>InnovateTranslations</h1>
  <p style="margin-top:10px">
    Professional translation services<br>
    PL • EN • RU
  </p>

  <div class="cta" style="justify-content:center; margin-top:28px">
    <a class="btn" href="/InnovateTranslations/pl/">Polski</a>
    <a class="btn secondary" href="/InnovateTranslations/en/">English</a>
    <a class="btn secondary" href="/InnovateTranslations/ru/">Русский</a>
  </div>

  <p class="small" style="margin-top:22px; opacity:.7">
    You will be redirected automatically if no selection is made.
  </p>
    </section>

    <div class="footer">
      <div>© <span id="y"></span> InnovateTranslations</div>
      <div class="small">Kontakt i oferta w wybranej wersji językowej.</div>
    </div>
  </div>

<script>
    const BASE = "/InnovateTranslations";
  const lang = (navigator.language || '').toLowerCase();
  const target =
    lang.startsWith('ru') ? `${BASE}/ru/` :
    lang.startsWith('en') ? `${BASE}/en/` :
    `${BASE}/pl/`;

  // przekieruj po chwili (żeby dać szansę kliknąć)
  setTimeout(()=> { window.location.href = target; }, 7000);

  document.getElementById('y').textContent = new Date().getFullYear();
</script>
</body>
</html>
